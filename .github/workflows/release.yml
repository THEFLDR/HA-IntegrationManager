name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in X.Y.Z format (0.1.1), published as a Release Candidate
        required: true
        type: string
      sha:
        description: Exact merged main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: integrationmanager-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Owner initiation
    runs-on: ubuntu-latest
    steps:
      - env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: test "$ACTOR" = THEFLDR && test "$REF" = refs/heads/main
  publish:
    name: Release - Publication
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-runtime.txt
      - name: Package exact validated SHA
        env:
          TAG: ${{ inputs.tag }}
        run: python -m scripts.package --tag "$TAG"
      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: python -m scripts.release publish "$TAG" "$SHA"
