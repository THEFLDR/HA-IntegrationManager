name: Publication

on:
  workflow_run:
    workflows: [Validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in X.Y.Z format (0.1.1), published as a Release Candidate
        required: true
        type: string
      sha:
        description: Exact merged main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: integrationmanager-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Publication authorization
    if: >-
      github.repository == 'THEFLDR/HA-IntegrationManager' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == 'THEFLDR' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.name == 'Validation' &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.repository.full_name == 'THEFLDR/HA-IntegrationManager' &&
        github.event.workflow_run.head_repository.full_name == 'THEFLDR/HA-IntegrationManager'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Select candidate SHA
        id: candidate
        env:
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        shell: python
        run: |
          import os, re
          sha = os.environ['SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise ValueError('A full validated commit SHA is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
  publish:
    name: Publication
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify Validation origin, version and release state
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release prepare
      - run: python -m pip install -r requirements-runtime.txt
        if: steps.candidate.outputs.publish == 'true'
      - name: Package exact validated SHA
        if: steps.candidate.outputs.publish == 'true'
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: python -m scripts.package --tag "$TAG"
      - name: Publish once
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: python -m scripts.release publish "$TAG" "$SHA"
