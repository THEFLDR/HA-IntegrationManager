name: CI - Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: CI - Validation
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        shell: python
        run: |
          import os, subprocess
          base = os.environ.get('BASE', '')
          code = True
          if os.environ['EVENT'] in ('push', 'pull_request') and base and set(base) != {'0'}:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              code = any(not (p.endswith('.md') or p.startswith(('docs/', '.github/ISSUE_TEMPLATE/'))) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'code={str(code).lower()}\n')
      - name: Documentation-only validation
        if: steps.changes.outputs.code == 'false'
        run: git diff --check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install test tools
        if: steps.changes.outputs.code == 'true'
        run: |
          python -m pip install -r requirements-test.txt
          npm ci --ignore-scripts
      - name: Ruff lint and format
        if: steps.changes.outputs.code == 'true'
        run: |
          ruff check .
          ruff format --check .
      - name: Tests and archive security
        if: steps.changes.outputs.code == 'true'
        run: |
          pytest --cov --cov-report=term-missing
          npm test
      - name: Validate release packaging
        if: steps.changes.outputs.code == 'true'
        run: python -m scripts.package
      - name: Dependency audit
        if: steps.changes.outputs.code == 'true'
        run: |
          pip-audit --strict -r requirements-runtime.txt
          npm audit --audit-level=high
  codeql:
    name: CI - CodeQL
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Documentation-only check
        if: needs.validation.outputs.code == 'false'
        run: echo 'No executable changes to scan'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.validation.outputs.code == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        if: needs.validation.outputs.code == 'true'
        with:
          languages: python,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        if: needs.validation.outputs.code == 'true'
